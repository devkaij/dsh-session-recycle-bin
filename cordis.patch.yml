# dsh-session-recycle-bin 的 bundle 补丁:向 profile 插入本插件的 Loader 条目。
# 作为 profile bundle,包内必须声明 dsh.bundle.patch 指向本文件,
# 否则 loadProfileDirectory 会以 "declares no dsh.bundle" 跳过本包,
# 运行时解析图也就不会包含本包,Loader 将无法导入插件模块。
# 插入的条目不带 config(全部走插件内默认值);需要覆盖时在 profile 的
# cordis.patch.yml 里按 id 覆盖(不带 insert 的条目):
#   - id: session-recycle-bin
#     config:
#       retentionDays: 30
- insert:
    - id: session-recycle-bin
      name: dsh-session-recycle-bin
